---
id: ND Power of Attorney Minor Short Form v2 intro
continue button field: nd_power_of_attorney_minor_short_form_v2_intro
question: "North Dakota power of attorney for care and custody of minor child(ren)"
subquestion: |2
  ### Before you get started
  - Gather your child(ren)'s names and birthdates.
  - Gather the name and address of the person you wish to appoint as attorney-in-fact.
  - Ensure you understand the powers you are delegating.
  
  ### When you are finished
  - Sign the form in front of a notary public or clerk of court to make it official.
  - Provide copies to the appointed attorney-in-fact and keep one for your records.
  
  You can use this form if you are a parent or guardian looking to delegate authority for your minor child(ren). It's important to understand the powers you are granting and the duration of this authority. Use this form if you are delegating authority for six months or less.
---
id: User s Name
question: |
  User's Full Name
subquestion: |
  Provide your full name
fields:
  - "User's full name": users1_name_full
    datatype: text
---
id: Guardian Information
question: |
  Guardian Information
subquestion: |
  Please specify your relationship to the minor child(ren).
fields:
  - "I am a parent": users1_is_parent
    datatype: yesno
  - "I am a legal guardian": users1_is_legal_guardian
    datatype: yesno
---
id: User s Address
question: |
  User's Address
subquestion: |
  Provide your residential address.
fields:
  - "User's residential address": users1_address
---
id: Powers To Delegate
question: |2
  Choose which powers to delegate.
subquestion: |2
  Would you like to delegate all the power and authority that you have as a parent or guardian?
fields:
  - label: "Yes, delegate all powers."
    field: delegate_all_powers_yes
    datatype: yesno
  - label: "No, I need to choose specific powers."
    field: delegate_specific_authority_yes
    datatype: yesno
  - label: "Select the powers you want to delegate:"
    field: specific_authority
    datatype: checkboxes
    choices:
      - "Decisions about education, including permission slips and school documents."
      - Consent to participation in activities.
      - "Health care decisions, including access to medical records and consent to disclosure of medical records."
      - "Authority to execute documents aside from school, activities, or health care."
      - "Other (fill in the box below):"
    show if: delegate_specific_authority_yes
    input type: area
  - label: "Describe the authority you want to delegate:"
    field: specific_authority_other
    show if: "specific_authority['Other (fill in the box below):']"
---
id: Authority Duration
question: |
  Authority Duration
subquestion: |
  Specify the end date for the power of attorney.
fields:
  - label: End date of authority
    field: users1_end_date
    datatype: date
    help: Must be within 6 months.
    min: "${ today().year }"
    max: "${ today().plus(months=6) }"
---
id: Contact Information
question: |
  Contact Information
subquestion: |
  Please provide your email contact.
fields:
  - "User's email contact": users1_email_address
    datatype: text
---
id: Notary Information
question: |
  Notary Information
subquestion: |
  Fill in the details for the notary signing.
fields:
  - "Date of notary signing": notary_date
    datatype: date
  - "Notary commission expiration date": notary_commission_expiration_date
    datatype: date
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
